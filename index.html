<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>量化工作台</title>
<style>
:root{
  --bg:#04070e; --bg2:#070b14;
  --card2:#0b1424; --line:rgba(0,214,255,.13);
  --txt:#e8f4ff; --sub:#7d93ad; --dim:#4d6076;
  --up:#ff4d6a; --dn:#00e08a; --gold:#ffc247; --cyan:#00d6ff; --blue:#00d6ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--txt);
  font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  font-size:13px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding-bottom:26px;overflow-y:auto;
  background:
    radial-gradient(120% 55% at 50% -8%, rgba(0,140,220,.22), transparent 62%),
    radial-gradient(90% 45% at 50% 104%, rgba(0,80,160,.16), transparent 70%),
    linear-gradient(180deg,#04070e 0%,#050910 55%,#04070e 100%);
  background-attachment:fixed}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(0,214,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,214,255,.05) 1px,transparent 1px);
  background-size:30px 30px;
  -webkit-mask-image:radial-gradient(circle at 50% 26%,#000 0%,rgba(0,0,0,.5) 55%,transparent 88%);
  mask-image:radial-gradient(circle at 50% 26%,#000 0%,rgba(0,0,0,.5) 55%,transparent 88%)}
#app,#hd{position:relative;z-index:1}
.hd{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(5,9,16,.97),rgba(5,9,16,.88));
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(0,214,255,.2);padding:11px 14px;display:flex;align-items:center;gap:10px;
  box-shadow:0 1px 0 rgba(0,214,255,.08),0 10px 26px rgba(0,0,0,.55)}
.hd h1{font-size:15px;margin:0;font-weight:700;letter-spacing:1.2px;position:relative;padding-left:11px;text-transform:none}
.hd h1::before{content:'';position:absolute;left:0;top:1px;bottom:1px;width:2px;
  background:linear-gradient(180deg,var(--cyan),rgba(0,214,255,0));box-shadow:0 0 10px var(--cyan)}
.hd h1::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dn);
  box-shadow:0 0 9px var(--dn);margin-left:9px;vertical-align:middle;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.hd .bk{font-size:18px;color:var(--cyan);width:26px;text-align:left;cursor:pointer;line-height:1;opacity:.85}
.hd .sp{flex:1}
.badge{font-size:10px;padding:2px 8px;border-radius:10px;border:1px solid rgba(0,214,255,.25);color:var(--sub);background:rgba(0,214,255,.05)}
.badge.gold{color:var(--gold);border-color:rgba(255,194,71,.4);background:rgba(255,194,71,.09);box-shadow:0 0 12px -4px rgba(255,194,71,.5)}
.badge.blue{color:var(--cyan);border-color:rgba(0,214,255,.4);background:rgba(0,214,255,.09)}
.badge.cyan{color:#8ff0c0;border-color:rgba(80,220,160,.45);background:rgba(80,220,160,.1)}
.wrap{padding:12px 12px 0}
.card{position:relative;background:linear-gradient(165deg,rgba(16,26,42,.9),rgba(6,10,18,.95));
  border:1px solid rgba(0,214,255,.12);border-radius:14px;padding:14px;margin-bottom:12px;max-width:100%;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.055),0 14px 34px -16px rgba(0,0,0,.9)}
.card::after{content:'';position:absolute;top:0;left:12%;right:12%;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(0,214,255,.55),transparent)}
.card.pad0{padding:0;overflow:hidden}
.ttl{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ttl b{font-size:13.5px;font-weight:700;letter-spacing:.6px;position:relative;padding-left:9px}
.ttl b::before{content:'';position:absolute;left:0;top:2px;bottom:2px;width:2px;background:var(--cyan);box-shadow:0 0 8px rgba(0,214,255,.8);opacity:.75}
.ttl .sp{flex:1}
.mini{font-size:11px;color:var(--sub)}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.kv{position:relative;background:linear-gradient(160deg,rgba(13,22,37,.92),rgba(6,10,18,.96));
  border:1px solid rgba(0,214,255,.1);border-radius:11px;padding:10px 11px;min-width:0;overflow:hidden}
.kv::after{content:'';position:absolute;right:-20px;top:-20px;width:48px;height:48px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,214,255,.16),transparent 70%);pointer-events:none}
.kv .k{font-size:10.5px;color:var(--sub);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px}
.kv .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.3px}
.up{color:var(--up);text-shadow:0 0 16px rgba(255,77,106,.28)}
.dn{color:var(--dn);text-shadow:0 0 16px rgba(0,224,138,.28)}
.gray{color:var(--sub)}
/* 策略卡 */
.slist{display:flex;flex-direction:column;gap:10px}
.sitem{position:relative;background:linear-gradient(165deg,rgba(17,28,46,.92),rgba(6,10,18,.95));
  border:1px solid rgba(0,214,255,.14);border-radius:14px;padding:14px;cursor:pointer;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 12px 30px -16px rgba(0,0,0,.9)}
.sitem:active{background:linear-gradient(165deg,rgba(22,36,58,.95),rgba(8,13,22,.96));border-color:rgba(0,214,255,.3)}
.sitem .nm{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.sitem .nm b{font-size:15px;font-weight:700;letter-spacing:.5px}
.sitem .sb{font-size:11px;color:var(--sub);margin-bottom:10px;line-height:1.45}
.sitem .row{display:flex;gap:13px;font-variant-numeric:tabular-nums}
.sitem .row div{min-width:0}
.sitem .row .l{font-size:9.5px;color:var(--dim);letter-spacing:.4px}
.sitem .row .v{font-size:16px;font-weight:700;letter-spacing:-.2px}
.spark{position:absolute;right:0;bottom:0;width:47%;height:62px;opacity:.42;pointer-events:none}
.addcard{border:1px dashed rgba(0,214,255,.28);border-radius:14px;padding:16px;text-align:center;color:var(--sub);cursor:pointer;
  background:linear-gradient(165deg,rgba(10,18,30,.6),rgba(5,9,15,.7))}
.addcard b{display:block;font-size:14px;color:var(--cyan);margin-bottom:3px;letter-spacing:.5px}
/* 图表 */
.chartbox{position:relative;height:198px;margin:2px 0 0}
.chartbox svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;touch-action:none;z-index:6}
.xhair{position:absolute;top:0;bottom:18px;width:1px;background:linear-gradient(180deg,rgba(0,214,255,.95),rgba(0,214,255,.25));
  box-shadow:0 0 10px rgba(0,214,255,.7);pointer-events:none;z-index:5;display:none}
.xdot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 0 3px rgba(255,194,71,.2),0 0 14px rgba(255,194,71,.9);transform:translate(-50%,-50%);pointer-events:none;z-index:7;display:none}
.xtip{position:absolute;top:4px;transform:translateX(-50%);background:rgba(6,12,22,.98);
  border:1px solid rgba(0,214,255,.45);border-radius:10px;padding:6px 10px;font-size:11px;line-height:1.55;
  white-space:nowrap;pointer-events:none;z-index:9;display:none;
  box-shadow:0 8px 22px rgba(0,0,0,.7),0 0 18px -6px rgba(0,214,255,.6);font-variant-numeric:tabular-nums}
.xtip b{color:var(--cyan);font-weight:700}
.rangetabs{display:flex;gap:6px;margin-bottom:6px}
.rt{font-size:11px;padding:4px 11px;border-radius:9px;background:rgba(10,18,30,.8);color:var(--sub);
  border:1px solid rgba(0,214,255,.08)}
.rt.on{color:var(--cyan);border-color:rgba(0,214,255,.45);background:rgba(0,214,255,.1);box-shadow:0 0 14px -6px rgba(0,214,255,.8)}
/* 日历 */
.calhd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calhd .nav{width:30px;height:30px;border-radius:9px;background:rgba(10,18,30,.85);border:1px solid rgba(0,214,255,.15);
  display:flex;align-items:center;justify-content:center;color:var(--cyan);cursor:pointer;font-size:15px;user-select:none}
.calhd .nav:active{background:rgba(0,214,255,.14)}
.calhd .lab{flex:1;text-align:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}
.calhd .mode{font-size:11px;padding:4px 11px;border-radius:9px;background:rgba(10,18,30,.85);color:var(--cyan);
  border:1px solid rgba(0,214,255,.2);cursor:pointer}
.calgrid{display:grid;gap:5px}
.calgrid.d{grid-template-columns:repeat(7,1fr)}
.calgrid.m{grid-template-columns:repeat(3,1fr)}
.calgrid.y{grid-template-columns:repeat(3,1fr)}
.cwd{font-size:9.5px;color:var(--dim);text-align:center;padding-bottom:2px;letter-spacing:.5px}
.cell{position:relative;background:rgba(11,20,36,.72);border-radius:9px;padding:5px 3px;text-align:center;min-height:46px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;cursor:pointer;
  border:1px solid rgba(0,214,255,.06);overflow:hidden}
.cell.empty{background:transparent;cursor:default;border-color:transparent}
.cell.today{border-color:rgba(0,214,255,.7);box-shadow:0 0 0 1px rgba(0,214,255,.25) inset,0 0 16px -4px rgba(0,214,255,.9)}
.cell.sel{border-color:var(--gold);background:rgba(255,194,71,.1);box-shadow:0 0 16px -6px rgba(255,194,71,.8)}
.cell .dd{font-size:9.5px;color:var(--sub);line-height:1.1}
.cell .rr{font-size:10.5px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.cell .am{font-size:9px;color:var(--dim);line-height:1.15;white-space:nowrap;overflow:hidden;max-width:100%;letter-spacing:-.2px}
.calgrid.m .cell,.calgrid.y .cell{min-height:62px}
.calgrid.m .cell .rr,.calgrid.y .cell .rr{font-size:16px}
.calgrid.m .cell .dd,.calgrid.y .cell .dd{font-size:11px}
.calsum{display:flex;justify-content:space-between;align-items:center;margin-top:9px;padding-top:9px;
  border-top:1px solid rgba(0,214,255,.12);font-size:11px;color:var(--sub)}
.calsum b{font-size:14px;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
/* 表格 */
.tbwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
col.c1{width:7%} col.c2{width:29%} col.c3{width:13%} col.c4{width:13%} col.c5{width:15%} col.c6{width:23%}
th{font-size:9.5px;color:var(--dim);font-weight:500;padding:6px 3px;text-align:right;
  border-bottom:1px solid rgba(0,214,255,.16);white-space:nowrap;letter-spacing:.5px}
th.l{text-align:left}
td{padding:7px 3px;font-size:12px;text-align:right;border-bottom:1px solid rgba(0,214,255,.07);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.l{text-align:left}
td .cd{display:block;font-size:12px;font-weight:700;color:var(--txt);overflow:hidden;text-overflow:ellipsis}
td .cn{display:block;font-size:9.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis}
tr.hold{background:linear-gradient(90deg,rgba(255,194,71,.12),rgba(255,194,71,.02))}
tr.hold td .cd{color:var(--gold)}
.tag{display:inline-block;font-size:9.5px;padding:1px 6px;border-radius:7px;line-height:1.6}
.tag.buy{background:rgba(255,77,106,.14);color:var(--up);border:1px solid rgba(255,77,106,.32)}
.tag.sell{background:rgba(0,224,138,.13);color:var(--dn);border:1px solid rgba(0,224,138,.32)}
.tag.hold-t{background:rgba(255,194,71,.14);color:var(--gold);border:1px solid rgba(255,194,71,.35)}
.tag.no{background:rgba(77,96,118,.15);color:var(--dim);border:1px solid rgba(77,96,118,.25)}
/* 指令 */
.cmd{position:relative;border-radius:12px;padding:13px;background:linear-gradient(160deg,rgba(14,24,40,.9),rgba(6,10,18,.96));
  border:1px solid rgba(0,214,255,.12);overflow:hidden}
.cmd::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,var(--cyan),rgba(0,214,255,0),var(--gold))}
.cmd .h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cmd .h b{font-size:14px;letter-spacing:.4px}
.cmd .big{font-size:20px;font-weight:800;margin:2px 0 6px;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.cmd .l{font-size:11.5px;color:var(--sub);line-height:1.75}
.cmd .l span{color:var(--txt)}
/* 持仓 */
.pos{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid rgba(0,214,255,.08)}
.pos:last-child{border-bottom:0}
.pos .ic{width:36px;height:36px;border-radius:10px;background:linear-gradient(160deg,rgba(255,194,71,.2),rgba(255,194,71,.05));
  border:1px solid rgba(255,194,71,.3);display:flex;align-items:center;justify-content:center;color:var(--gold);
  font-size:12px;font-weight:700;flex:0 0 36px}
.pos .mn{flex:1;min-width:0}
.pos .mn b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos .mn span{font-size:10.5px;color:var(--dim)}
.pos .rt{text-align:right;min-width:0}
.pos .rt b{display:block;font-size:13px;font-variant-numeric:tabular-nums}
.pos .rt span{font-size:10.5px;color:var(--dim)}
/* 表单 */
.frow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(0,214,255,.08)}
.frow:last-child{border-bottom:0}
.frow label{flex:0 0 106px;font-size:12px;color:var(--sub)}
.frow input,.frow select{flex:1;min-width:0;background:rgba(10,18,30,.9);border:1px solid rgba(0,214,255,.14);border-radius:9px;
  color:var(--txt);font-size:13px;padding:8px 10px;outline:none;font-family:inherit}
.frow input:focus,.frow select:focus{border-color:rgba(0,214,255,.55);box-shadow:0 0 14px -6px rgba(0,214,255,.8)}
.btn{display:block;width:100%;padding:13px;border-radius:12px;
  background:linear-gradient(135deg,#00d6ff,#0077b6);color:#02121c;font-weight:800;font-size:14px;border:0;cursor:pointer;
  margin-top:12px;letter-spacing:.5px;box-shadow:0 10px 26px -12px rgba(0,214,255,.8)}
.btn:active{opacity:.85}
.btn.ghost{background:rgba(10,18,30,.9);color:var(--txt);border:1px solid rgba(0,214,255,.2);font-weight:500;box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chip{font-size:11px;padding:5px 9px;border-radius:9px;background:rgba(10,18,30,.9);color:var(--sub);
  border:1px solid rgba(0,214,255,.1);cursor:pointer}
.chip.on{color:var(--cyan);border-color:rgba(0,214,255,.5);background:rgba(0,214,255,.12);box-shadow:0 0 12px -6px rgba(0,214,255,.9)}
.hint{font-size:11px;color:var(--dim);line-height:1.6;margin-top:8px}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:rgba(8,14,24,.98);
  border:1px solid rgba(0,214,255,.35);border-radius:11px;padding:10px 16px;font-size:12.5px;z-index:200;
  box-shadow:0 10px 30px rgba(0,0,0,.7),0 0 22px -8px rgba(0,214,255,.8);display:none;max-width:88%}
.tabbar{display:flex;gap:6px;margin-bottom:10px}
.tabbar .t{flex:1;text-align:center;font-size:12px;padding:7px;border-radius:10px;background:rgba(10,18,30,.9);color:var(--sub);cursor:pointer}
.tabbar .t.on{background:rgba(0,214,255,.12);color:var(--cyan);border:1px solid rgba(0,214,255,.35);padding:6px}
.foot{text-align:center;font-size:10.5px;color:var(--dim);padding:6px 0 14px}
.gauge{position:relative;height:6px;border-radius:3px;background:rgba(0,214,255,.1);overflow:hidden;margin-top:7px}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--cyan),var(--gold));box-shadow:0 0 10px rgba(0,214,255,.7)}
</style>
</head>

<div id="app"></div>
<div class="toast" id="toast"></div>

function pct(v,dg){ if(v===null||v===undefined||isNaN(v)) return '—'; return (v>=0?'+':'')+v.toFixed(dg===undefined?2:dg)+'%'}
function cls(v){ if(v===null||v===undefined||isNaN(v)||v===0) return 'gray'; return v>0?'up':'dn' }

/* 行情：某代码在 <= 指定日期的收盘序列 */
var _cacheCl={};
function clUpTo(code, d){
  var key=code+'|'+d;
  if(_cacheCl[key]) return _cacheCl[key];
  var arr=DAILY[code]; if(!arr) return null;
  // 二分找最后一个 <= d 的下标
  var lo=0,hi=AXMASTER.length-1,pos=-1;
  while(lo<=hi){var mid=(lo+hi)>>1; if(AXMASTER[mid]<=d){pos=mid;lo=mid+1;}else{hi=mid-1;}}
  if(pos<0) return null;
  var out=[];
  for(var i=0;i<=pos;i++){ var v=arr[i]; if(v>0) out.push(v/1000); }
  _cacheCl[key]=out;
  return out;
}
function pxAt(code,d){
  var arr=DAILY[code]; if(!arr) return null;
  var lo=0,hi=AXMASTER.length-1,pos=-1;
  while(lo<=hi){var mid=(lo+hi)>>1; if(AXMASTER[mid]<=d){pos=mid;lo=mid+1;}else{hi=mid-1;}}
  if(pos<0) return null;
  for(var i=pos;i>=0;i--){ if(arr[i]>0) return arr[i]/1000; }
  return null;
}
/* 换手日索引 */
function axIndexOf(d){ var i=AXMASTER.indexOf(d); return i; }
function tradeDaysBetween(d1,d2){
  var i1=axIndexOf(d1), i2=axIndexOf(d2);
  if(i1<0||i2<0) return 0;
  var n=0; for(var i=i1+1;i<=i2;i++){ if(!isNaN(i)) n++; }
  return n;
}

/* ============ 动量 ============ */
function wslope(cl,n){
  var L=cl.length; if(L<n) return null;
  var p=cl.slice(L-n);
  for(var i=0;i<n;i++) if(!(p[i]>0)) return null;
  var y=new Array(n), w=new Array(n);
  for(i=0;i<n;i++){ y[i]=Math.log(p[i]); w[i]=1+i/(n-1); }
  // slope：回归矩用 w²（等价 np.polyfit(w=linspace(1,2))）
  var sw2=0,sxw=0,syw=0,sxxw=0,sxyw=0;
  for(i=0;i<n;i++){ var w2=w[i]*w[i]; sw2+=w2; sxw+=w2*i; syw+=w2*y[i]; sxxw+=w2*i*i; sxyw+=w2*i*y[i]; }
  var den=sw2*sxxw-sxw*sxw; if(!den) return null;
  var slope=(sw2*sxyw-sxw*syw)/den, b=(syw-slope*sxw)/sw2;
  var ann=Math.exp(slope*250)-1;
  // R²：权重用 w 一次（加权均值）
  var sw=0,sy2=0;
  for(i=0;i<n;i++){ sw+=w[i]; sy2+=w[i]*y[i]; }
  var ybar=sy2/sw, ssr=0, sst=0;
  for(i=0;i<n;i++){ var pr=slope*i+b; ssr+=w[i]*Math.pow(y[i]-pr,2); sst+=w[i]*Math.pow(y[i]-ybar,2); }
  var r2=sst>0?1-ssr/sst:0;
  return ann*r2;
}
function pctN(cl,n){
  if(!cl||cl.length<n+1) return null;
  var a=cl[cl.length-1], b=cl[cl.length-1-n];
  if(!(b>0)) return null;
  return a/b-1;
}
/* 单只动量 */
function momOf(strat, code, d){
  var cl=clUpTo(code,d); if(!cl||cl.length<3) return null;
  var m=strat.mom;
  var m1=null,m2=null;
  if(m.type==='wslope'){ m1=wslope(cl,m.m1); if(m.m2) m2=wslope(cl,m.m2); }
  else { m1=pctN(cl,m.m1); if(m.m2) m2=pctN(cl,m.m2); }
  return {m1:m1,m2:m2,cl:cl};
}
/* 某日全池排名 */
var _rankCache={};
function rankAt(strat,d){
  var key=strat.id+'|'+d;
  if(_rankCache[key]) return _rankCache[key];
  var out=[], m=strat.mom;
  for(var i=0;i<strat.pool.length;i++){
    var c=strat.pool[i];
    var r=momOf(strat,c,d); if(!r) continue;
    var px=pxAt(c,d);
    var prev=pxAt(c,prevAxDay(d));
    var chg=(px&&prev&&prev>0)?(px/prev-1)*100:null;
    if(r.m1===null) continue;
    var ok=true;
    if(m.m1lo!==undefined && !(r.m1>=m.m1lo && r.m1<=m.m1hi)) ok=false;
    if(m.m2 && m.m2lo!==undefined && !(r.m2>=m.m2lo && r.m2<=m.m2hi)) ok=false;
    if(strat.excludeLimit!==false && chg!==null && Math.abs(chg)>=9.8) ok=false;
    out.push({code:c,name:(strat.names&&strat.names[c])||c,px:px,chg:chg,m1:r.m1,m2:r.m2,ok:ok});
  }
  out.sort(function(a,b){ return b.m1-a.m1; });
  _rankCache[key]=out;
  return out;
}
function prevAxDay(d){
  var i=AXMASTER.indexOf(d); if(i<=0) return AXMASTER[0];
  return AXMASTER[i-1];
}
/* 合格候选中的第一名 */
function pickAt(strat,d){
  var r=rankAt(strat,d);
  for(var i=0;i<r.length;i++) if(r[i].ok) return r[i];
  return null;
}

/* ============ 回测引擎（自定义策略用） ============ */
function runBacktest(cfg){
  var pool=cfg.pool, mom=cfg.mom;
  var start=cfg.start||'20200102', end=cfg.end||AXMASTER[AXMASTER.length-1];
  var dates=AXMASTER.filter(function(d){return d>=start&&d<=end;});
  if(!dates.length) return {nav:[],holds:{},metrics:{}};
  var cash=cfg.init, hold=null, nav=[], pts=[], trades=[], avail={};
  var reserve=cfg.reserve===undefined?0.02:cfg.reserve, slip=cfg.slip===undefined?0.001:cfg.slip;
  var comm=cfg.comm===undefined?0.00015:cfg.comm, lot=cfg.lot||100;
  var dayIdx={}; dates.forEach(function(d,i){dayIdx[d]=i;});
  function daysHeld(a,b){ return a?Math.max((dayIdx[b]||0)-(dayIdx[a]||0),0):0; }
  for(var t=0;t<dates.length;t++){
    var d=dates[t];
    var _btId='bt'+pool.join('-')+mom.type+mom.m1+'-'+mom.m2+'-'+mom.m1lo+'-'+mom.m1hi;
    var target=pickAt({id:_btId,pool:pool,names:cfg.names,mom:mom,excludeLimit:true},d);
    var tgt=target?target.code:null;
    var cur=hold?hold.code:null;
    if(tgt!==cur){
      var dh=hold?daysHeld(hold.date,d):0;
      if(!hold || dh>=cfg.minHold){
        if(hold){
          var sp=pxAt(cur,d);
          if(sp){ cash+=hold.sh*sp*(1-slip)*(1-comm); trades.push({d:d,a:'S',c:cur,p:+(sp*(1-slip)).toFixed(3),sh:hold.sh}); hold=null; }
          else tgt=null;
        }
        if(!hold && tgt){
          var bp=pxAt(tgt,d);
          if(bp){
            var sh=Math.floor(cash*(1-reserve)/(bp*(1+slip)*(1+comm))/lot)*lot;
            if(sh>=lot){ cash-=sh*bp*(1+slip)*(1+comm); hold={code:tgt,sh:sh,date:d}; trades.push({d:d,a:'B',c:tgt,p:+(bp*(1+slip)).toFixed(3),sh:sh}); }
          }
        }
      }
    }
    var eq=cash+(hold?hold.sh*(pxAt(hold.code,d)||0):0);
    nav.push([dstr(d),+eq.toFixed(2)]);
    if(hold && (!pts.length || pts[pts.length-1][1]!==hold.code)) pts.push([dstr(d),hold.code]);
  }
  var m=metrics(nav,cfg.init,dates);
  return {nav:nav,pts:pts,trades:trades,metrics:m};
}
function metrics(nav,init,dates){
  if(!nav.length) return {};
  var eq=nav.map(function(x){return x[1];});
  var tot=eq[eq.length-1]/init-1;
  var ann=Math.pow(eq[eq.length-1]/init,252/eq.length)-1;
  var rets=[]; for(var i=1;i<eq.length;i++) rets.push(Math.log(eq[i]/eq[i-1]));
  var mean=0; rets.forEach(function(v){mean+=v;}); mean/=rets.length||1;
  var sd=0; rets.forEach(function(v){sd+=Math.pow(v-mean,2);}); sd=Math.sqrt(sd/(rets.length||1))*Math.sqrt(252);
  var peak=0,mdd=0;
  eq.forEach(function(v){ if(v>peak)peak=v; var dd=v/peak-1; if(dd<mdd)mdd=dd; });
  var sharpe=sd>0?(ann-0.02)/sd:0;
  return {total:+(tot*100).toFixed(2),annual:+(ann*100).toFixed(2),mdd:+(mdd*100).toFixed(2),vol:+(sd*100).toFixed(2),sharpe:+sharpe.toFixed(2)};
}

  var list=[];

  CUSTOM.forEach(function(c){ list.push(c); });
  return list;
}
function getStrat(id){
  for(var k in BUILTIN){ if(BUILTIN[k].id===id) return BUILTIN[k]; }
  for(var i=0;i<CUSTOM.length;i++) if(CUSTOM[i].id===id) return CUSTOM[i];
  return null;
}
/* 策略运行结果（nav/pts/holdMap） */
var _runCache={};
function runOf(s){
  if(_runCache[s.id]) return _runCache[s.id];
  var r;
  if(s.official && s.nav){
    var pts0=s.pts;
    if(!pts0 && s.holds && s.holds.length){
      pts0=s.holds.map(function(h){ return [h.date, h.code]; });
    }
    r={nav:s.nav,pts:pts0||[],trades:s.trades||[]};
  }else{
    r=runBacktest({pool:s.pool,names:s.names,mom:s.mom,init:s.init,start:s.start,end:s.end,
      comm:s.comm,slip:s.slip,minHold:s.minHold,reserve:s.reserve,lot:s.lot});
    if(!s.metrics) s.metrics=r.metrics;
  }
  // holdMap
  var hm={}, cur=null;
  var pts=r.pts;
  if(pts&&pts.length&&typeof pts[0][0]==='number'){
    // 索引型：按 nav 索引
    var pi=0;
    for(var i=0;i<r.nav.length;i++){
      while(pi<pts.length && pts[pi][0]===i){ cur=pts[pi][1]; pi++; }
      hm[und(r.nav[i][0])]=cur;
    }
  }else if(pts&&pts.length){
    var pj=0;
    // 日期型：跑遍所有 nav 日期，按日期推进
    var sorted=pts.slice().sort(function(a,b){return a[0]<b[0]?-1:1;});
    for(var j=0;j<r.nav.length;j++){
      var dj=und(r.nav[j][0]);
      while(pj<sorted.length && und(sorted[pj][0])<=dj){ cur=sorted[pj][1]; pj++; }
      hm[dj]=cur;
    }
  }
  r.holdMap=hm;
  _runCache[s.id]=r;
  return r;
}

function sparkPath(nav,w,h){
  if(!nav.length) return '';
  var vs=nav.map(function(x){return x[1];});
  var mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs), rg=(mx-mn)||1;
  var pts=vs.map(function(v,i){ return [(i/(vs.length-1))*w, h-((v-mn)/rg)*(h-6)-3]; });
  // 抽稀
  var step=Math.max(1,Math.floor(pts.length/60));
  var d=[]; for(var i=0;i<pts.length;i+=step) d.push(pts[i][0].toFixed(1)+','+pts[i][1].toFixed(1));
  d.push(pts[pts.length-1][0].toFixed(1)+','+pts[pts.length-1][1].toFixed(1));
  return d.join(' ');
}

  html+='</div>';

function amtFmt(v){
  if(v===null||v===undefined||isNaN(v)) return '—';
  if(v>=10000) return (v/10000).toFixed(1)+'万';
  if(v>=1000) return (v/1000).toFixed(1)+'k';
  return Math.round(v)+'';
}
function daysSince2(r,d1,d2){ return daysBetween(r,d1,d2); }
function daysSince(r,code,d){
  var nav=r.nav;
  for(var i=nav.length-1;i>=0;i--){
    if(r.holdMap[und(nav[i][0])]===code){ if(i>0&&r.holdMap[und(nav[i-1][0])]!==code) return nav.length-1-i+1; }
    else break;
  }
  return 1;
}
function holdAt(r,d){
  if(!r.holdMap) return null;
  return r.holdMap[und(d)]||null;
}

/* ---- 走势图 ---- */
var CHART={pts:[],xs:[],nav:[]};

  var vs=navs.map(function(x){return x[1];});

  var W=1000,H=196,padT=14,padB=16;

  CHART.pts=pts; CHART.nav=navs;
  var y0=padT+(1-(navs[0][1]-mn)/rg)*(H-padT-padB);

  var col=navs[navs.length-1][1]>=navs[0][1]?'#ff4d4f':'#00c853';
  // 网格
  var g='';
  for(var k=0;k<=3;k++){

  }

  var area='M'+pts[0][0].toFixed(1)+' '+(H-padB)+' L'+pts.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' L')+' L'+pts[pts.length-1][0].toFixed(1)+' '+(H-padB)+' Z';
  var gd=col==='#ff4d4f'?'rgba(255,77,79,.13)':'rgba(0,200,83,.13)';
  svg.innerHTML=g
    +'<path d="'+area+'" fill="'+gd+'"/>'
    +'<path d="'+dpath+'" fill="none" stroke="'+col+'" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>'
    +'<line x1="0" y1="'+y0.toFixed(1)+'" x2="'+W+'" y2="'+y0.toFixed(1)+'" stroke="#2c3648" stroke-width="1" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>';
  // 尾点
  svg.innerHTML+='<circle cx="'+pts[pts.length-1][0].toFixed(1)+'" cy="'+pts[pts.length-1][1].toFixed(1)+'" r="3" fill="'+col+'" vector-effect="non-scaling-stroke"/>';
  // 首末日期

    +'<text x="986" y="192" fill="#5a6577" font-size="10" text-anchor="end">'+navs[navs.length-1][0].slice(2)+'</text>';
}
function showXAt(clientX){
  var box=document.getElementById('cbox'); if(!box||!CHART.pts.length) return;
  var rc=box.getBoundingClientRect();
  var rx=Math.max(0,Math.min(1,(clientX-rc.left)/rc.width));
  var W=1000; var want=rx*W;
  // 二分找最近点
  var lo=0,hi=CHART.pts.length-1;
  while(lo<hi){ var mid=(lo+hi)>>1; if(CHART.pts[mid][0]<want) lo=mid+1; else hi=mid; }
  if(lo>0 && Math.abs(CHART.pts[lo][0]-want)>Math.abs(CHART.pts[lo-1][0]-want)) lo--;
  var p=CHART.pts[lo], nv=CHART.nav[lo];
  var xp=(p[0]/W)*100;
  var xh=document.getElementById('xh'), xd=document.getElementById('xd'), xt=document.getElementById('xt');
  xh.style.display='block'; xh.style.left=xp+'%';
  xd.style.display='block'; xd.style.left=xp+'%'; xd.style.top=(p[1]/196*100)+'%';
  var prev=lo>0?CHART.nav[lo-1][1]:nv[1];
  var dp=prev?((nv[1]/prev-1)*100):0;
  var txt='<b>'+nv[0]+'</b><br>净值 '+fmt(nv[1],2)+'<br>当日 <span style="color:'+(dp>=0?'#ff4d4f':'#00c853')+'">'+pct(dp,2)+'</span>';
  xt.innerHTML=txt; xt.style.display='block';
  xt.style.left=Math.max(30,Math.min(70,xp))+'%';
  xt.style.transform='translateX('+(xp<30?'-20%':xp>70?'-80%':'-50%')+')';
  VIEW.focus=und(nv[0]);
}
function hideX(){
  ['xh','xd','xt'].forEach(function(i){var e=document.getElementById(i); if(e) e.style.display='none';});
}
function bind(){
  var ov=document.getElementById('ov');
  if(ov && !ov._b){
    ov._b=true;
    var down=false;
    ov.addEventListener('pointerdown',function(e){down=true; ov.setPointerCapture&&ov.setPointerCapture(e.pointerId); showXAt(e.clientX); e.preventDefault();});
    ov.addEventListener('pointermove',function(e){ if(down){ showXAt(e.clientX); e.preventDefault(); } });
    ov.addEventListener('pointerup',function(e){ if(down&&VIEW.focus){ VIEW.selCell=VIEW.focus; var s=getStrat(VIEW.sid); var r=runOf(s); var selD=VIEW.focus; drawFocus(s,r,selD); drawRank(s,r,selD,holdAt(r,selD)); } down=false; });
    ov.addEventListener('pointercancel',function(){down=false;});
    ov.addEventListener('pointerleave',function(e){ if(!down) hideX(); });
  }
}

function heat(p){

  if(p<0) return ' style="background:linear-gradient(160deg,rgba(0,224,138,'+(0.05+a*0.28).toFixed(3)+'),rgba(0,224,138,.02))"';

      var ds2=thisY+pad(mm);

      for(var k in daily){ if(k.slice(0,6)===ds2){ mfac*=(1+daily[k].p/100); has=true; } }
      var acc=(mfac-1)*100;
      if(has){ycnt++;}
      grid2+='<div class="cell'+(has?'':' empty')+'"'+(has?heat(acc):'')+(has?' onclick="jumpMonth('+thisY+','+mm+')"':'')
        +'><div class="dd">'+mm+'月</div>'
        +(has?'<div class="rr '+cls(acc)+'">'+pct(acc,2)+'</div>':'<div class="rr gray">—</div>')

  }else{

    var prevY=s.init||1;

    var grid3='', tot=0;

    // 保持 3 列布局，从 calY 起往前显示 9 年

      grid3+='<div class="cell'+(has2?'':' empty')+'"'+(has2?heat(ys[yy]):'')+(has2?' onclick="jumpYear('+yy+')"':'')
        +'><div class="dd">'+yy+'</div>'
        +(has2?'<div class="rr '+cls(ys[yy])+'">'+pct(ys[yy],1)+'</div>':'<div class="rr gray">—</div>')
        +'</div>';
    }
    var totf=null;

    if(vE&&vS&&vS>0) totf=vE/vS;
    body.className='calgrid y'; body.innerHTML=grid3;
    var tot;
    if(totf!==null) tot=(totf-1)*100;
    else { var tf=1; for(var yy3=startY;yy3<=endY;yy3++){ if(ys[yy3]!==undefined) tf*=(1+ys[yy3]/100); } tot=(tf-1)*100; }
    if(sum) sum.innerHTML='<span>区间累计 · '+startY+'~'+endY+'（净值口径）</span><b class="'+cls(tot)+'">'+pct(tot,1)+'</b>';
  }
}

/* ---- 调仓指令 ---- */
function drawCmd(s,r,lastD,hold,holdDays,target){
  var el=document.getElementById('cmdBody'); if(!el) return;
  var CMD_EXTRA='';
  var todayPct=0;
  var daily=dailyOf(s,r); if(daily[lastD]) todayPct=daily[lastD].p;
  var navV=r.nav[r.nav.length-1][1];
  var budget=navV*(1-(s.reserve===undefined?0.02:s.reserve));
  var tgt=target?target.code:null;
  var tgtNm=target?(target.name||tgt):'—';
  var action='', color='gray', big='';
  if(!hold && !tgt){
    action='空仓等待'; big='无合格标的';
  }else if(!hold && tgt){
    action='买入'; color='up';
    var pxB0=pxAt(tgt,lastD);
    var sh0=pxB0?Math.floor(budget/pxB0/(s.lot||100))*(s.lot||100):0;
    big='买入 '+tgtNm;
    CMD_EXTRA='约 '+sh0+' 份 @ '+fmt(pxB0,3)+' · 动用 '+fmt(budget,0)+' 元';
  }else if(hold && tgt===hold){
    action='继续持有'; color='hold-t'; big='持有 '+((s.names&&s.names[hold])||hold);
  }else if(hold && !tgt){
    action='卖出'; color='dn'; big='清仓 '+((s.names&&s.names[hold])||hold);
  }else{
    action='换仓'; color='up'; big=((s.names&&s.names[hold])||hold)+' → '+tgtNm;
  }
  var note='';
  if(hold && tgt && tgt!==hold){
    var pxB=pxAt(tgt,lastD);
    var sh2=pxB?Math.floor(budget/pxB/(s.lot||100))*(s.lot||100):0;
    note='卖出 '+((s.names&&s.names[hold])||hold)+' 全部 · 买入 '+tgtNm+' 约 '+sh2+' 份 @ '+fmt(pxB,3)+' · 动用 '+fmt(budget,0)+' 元';
  }else if(hold && tgt===hold){
    note='已持有 '+holdDays+' 个交易日'+(s.minHold?'（最短 '+s.minHold+' 日'+(holdDays>=s.minHold?'，已解锁':'，锁定期内')+'）':'')
      +(hold&&s.mom?' · 当前动量 '+(function(){var rr=rankAt(s,lastD);for(var i=0;i<rr.length;i++)if(rr[i].code===hold)return fmt(rr[i].m1,3);return '—';})():'');
  }else if(!hold&&tgt){
    note='首次建仓 · 建议 '+ (s.exec||'收盘前') +' 执行';
  }else if(hold&&!tgt){
    note='标的跌破动量阈值（'+(s.mom.m1lo*100).toFixed(1)+'%~'+(s.mom.m1hi*100).toFixed(0)+'%），全部转现金';
  }else{
    note='无合格标的，保持现金';
  }
  el.innerHTML='<div class="cmd">'
    +'<div class="h"><span class="tag '+(color==='gray'?'no':color)+'">'+action+'</span>'
    +'<span class="mini">当日 <span class="'+cls(todayPct)+'">'+pct(todayPct,2)+'</span></span></div>'
    +'<div class="big '+(color==='up'?'up':color==='dn'?'dn':'gold')+'">'+big+'</div>'
    +'<div class="l">'+note+'</div>'
    +(CMD_EXTRA?'<div class="l" style="color:#e6eaf2;margin-top:3px">'+CMD_EXTRA+'</div>':'')
    +'</div>';
}

/* ---- 持仓 ---- */
function drawPos(s,r,lastD,hold,todayPct){

    +'<div class="rt"><b>'+fmt(mv,0)+'</b><span class="'+(pnl>=0?'up':'dn')+'">'+(pnl>=0?'+':'')+fmt(pnl,0)+' 元</span></div></div>';

function daysBetween(r,d1,d2){
  d1=und(String(d1)); d2=und(String(d2));
  var i1=-1,i2=-1;
  for(var i=0;i<r.nav.length;i++){ var d=und(r.nav[i][0]); if(d===d1&&i1<0)i1=i; if(d===d2)i2=i; }
  if(i1<0||i2<0) return 0;
  return Math.max(i2-i1,0);
}

/* ---- 排名表 ---- */
function biasOf(code,d,n){
  var cl=clUpTo(code,d); if(!cl||cl.length<n) return null;
  var s=0; for(var i=cl.length-n;i<cl.length;i++) s+=cl[i];
  var ma=s/n; if(!(ma>0)) return null;
  return cl[cl.length-1]/ma-1;
}
function drawRank(s,r,ds,holdCode){
  var tb=document.getElementById('rankBody'); if(!tb) return;
  var rk=rankAt(s,ds);
  var target=pickAt(s,ds);
  var rows='';
  rk.forEach(function(x,i){
    var isHold=x.code===holdCode;
    var isTgt=target&&x.code===target.code;
    var sig = isHold?'<span class="tag hold-t">持有</span>'
      : isTgt&&!isHold?'<span class="tag buy">买入</span>'
      : x.ok?'<span class="tag no">候选</span>':'<span class="tag no">不合格</span>';
    var bz=biasOf(x.code,ds,20);
    rows+='<tr class="'+(isHold?'hold':'')+'">'
      +'<td>'+(i+1)+'</td>'
      +'<td class="l"><span class="cd">'+x.code+'</span><span class="cn">'+x.name+'</span></td>'
      +'<td>'+fmt(x.px,3)+'</td>'
      +'<td class="'+cls(x.chg)+'">'+pct(x.chg,2)+'</td>'
      +'<td class="'+(x.ok?'':'gray')+'">'+(s.mom.type==='pct'?pct(x.m1*100,2):fmt(x.m1,3))+'</td>'
      +'<td class="gray">'+(x.m2!==null&&x.m2!==undefined?(s.mom.type==='pct'?pct(x.m2*100,2):fmt(x.m2,3)):'—')+'</td>'
      +'<td class="'+cls(bz)+'">'+(bz!==null?pct(bz*100,2):'—')+'</td>'
      +'<td>'+sig+'</td>'
      +'</tr>';
  });
  tb.innerHTML=rows||'<tr><td colspan="8" class="gray" style="text-align:center;padding:14px">暂无数据</td></tr>';
}
</script>

<script>
var LIVE={};
function secOf(c){ return (c[0]==='5'||c[0]==='6'?'sh':'sz')+c; }
function refreshLive(){
  var s=getStrat(VIEW.sid); if(!s) return;
  var secs=s.pool.map(secOf);
  toast('拉取最新价…');
  var sc=document.createElement('script');
  sc.src='https://qt.gtimg.cn/q='+secs.join(',')+'&r='+Math.random();
  sc.onload=sc.onerror=function(){
    var live={}, n=0;
    for(var i=0;i<s.pool.length;i++){
      var sec=secs[i], raw=window['v_'+sec];
      if(!raw) continue;
      var f=String(raw).split('~');
      if(f.length<5) continue;
      var px=parseFloat(f[3]), prev=parseFloat(f[4]);
      if(!(px>0)||!(prev>0)) continue;
      live[s.pool[i]]={px:px,prev:prev,chg:(px/prev-1)*100};
      n++;
    }
    try{ sc.remove(); }catch(e){}
    if(!n){ toast('联网失败，仍用内置数据'); return; }
    LIVE=live;
    var r=runOf(s);
    var lastD=und(r.nav[r.nav.length-1][0]);
    var hold=holdAt(r,lastD);
    var tp=(hold&&LIVE[hold])?LIVE[hold].chg:0;
    try{ drawPos(s,r,lastD,hold,tp); }catch(e){}
    var rk=rankAt(s,lastD).slice(), target=pickAt(s,lastD), rows='';
    rk.forEach(function(x,i){
      var L=LIVE[x.code];
      var px=L?L.px:x.px, chg=L?L.chg:x.chg;
      var isHold=x.code===hold, isTgt=target&&x.code===target.code;
      var sig=isHold?'<span class="tag hold-t">持有</span>':(isTgt?'<span class="tag buy">买入</span>':(x.ok?'<span class="tag no">候选</span>':'<span class="tag no">不合格</span>'));
      var bz=biasOf(x.code,lastD,20);
      rows+='<tr class="'+(isHold?'hold':'')+'"><td>'+(i+1)+'</td>'
        +'<td class="l"><span class="cd">'+x.code+'</span><span class="cn">'+x.name+'</span></td>'
        +'<td>'+fmt(px,3)+'</td><td class="'+cls(chg)+'">'+pct(chg,2)+'</td>'
        +'<td class="'+(x.ok?'':'gray')+'">'+(s.mom.type==='pct'?pct(x.m1*100,2):fmt(x.m1,3))+'</td>'
        +'<td class="gray">'+(x.m2!=null?(s.mom.type==='pct'?pct(x.m2*100,2):fmt(x.m2,3)):'—')+'</td>'
        +'<td class="'+cls(bz)+'">'+(bz!==null?pct(bz*100,2):'—')+'</td><td>'+sig+'</td></tr>';
    });
    var tb=document.getElementById('rankBody'); if(tb) tb.innerHTML=rows;
    toast('已更新 '+n+' 只 · '+new Date().toTimeString().slice(0,5));
  };
  document.head.appendChild(sc);
}
</script>
<script>

    +'</select></div>'

    +'<div class="frow"><label>副窗口 M2</label><input id="fM2" type="number" value="'+NEWP.m2+'" placeholder="0=不用"></div>'

    +'<div class="frow"><label>M1 阈值上限</label><input id="fM1hi" type="number" step="0.1" value="'+NEWP.m1hi+'"></div>'
    +'<div class="frow"><label>最短持有(日)</label><input id="fHold" type="number" value="'+NEWP.minHold+'"></div>'
    +'<div class="frow"><label>初始资金</label><input id="fInit" type="number" value="'+NEWP.init+'"></div>'
    +'<div class="frow"><label>佣金(单边)</label><input id="fComm" type="number" step="0.00001" value="'+NEWP.comm+'"></div>'
    +'<div class="frow"><label>滑点</label><input id="fSlip" type="number" step="0.0001" value="'+NEWP.slip+'"></div>'
    +'<button class="btn" onclick="doBacktest()">开始回测</button>'

    +'</div>';
  html+='<div class="card" id="btResult" style="display:none"></div>';
  html+='<div class="foot"><button class="btn ghost" onclick="go(\'home\')" style="margin:0">返回工作台</button></div></div>';
  document.getElementById('app').innerHTML=html;
  document.getElementById('hd').innerHTML='<div class="bk" onclick="go(\'home\')">‹</div><h1>新建策略</h1><div class="sp"></div><span class="badge" id="hdSub">自定义</span>';
  document.getElementById('hdSub').textContent='自定义';
}
function togglePool(c){
  var i=NEWP.pool.indexOf(c);
  if(i>=0) NEWP.pool.splice(i,1); else NEWP.pool.push(c);
  renderCustom();
}
function readForm(){
  NEWP.name=(document.getElementById('fName').value||'我的策略').trim();
  NEWP.momType=document.getElementById('fType').value;
  NEWP.m1=+document.getElementById('fM1').value||20;
  NEWP.m2=+document.getElementById('fM2').value||0;
  NEWP.m1lo=+document.getElementById('fM1lo').value||0;
  NEWP.m1hi=+document.getElementById('fM1hi').value||3;
  NEWP.minHold=+document.getElementById('fHold').value||1;
  NEWP.init=+document.getElementById('fInit').value||5000;
  NEWP.comm=+document.getElementById('fComm').value||0.00015;
  NEWP.slip=+document.getElementById('fSlip').value||0;
}
function doBacktest(){
  readForm();
  if(NEWP.pool.length<2){ toast('至少选 2 只标的'); return; }
  toast('回测中…');
  var mom={type:NEWP.momType,m1:NEWP.m1,m2:NEWP.m2,m1lo:NEWP.m1lo,m1hi:NEWP.m1hi,m2lo:0,m2hi:10};

  var m=r.metrics;

    +'<div class="grid4">'
    +'<div class="kv"><div class="k">总收益</div><div class="v '+cls(m.total)+'">'+pct(m.total,1)+'</div></div>'
    +'<div class="kv"><div class="k">年化</div><div class="v '+cls(m.annual)+'">'+pct(m.annual,2)+'</div></div>'
    +'<div class="kv"><div class="k">最大回撤</div><div class="v dn">'+fmt(m.mdd,2)+'%</div></div>'
    +'<div class="kv"><div class="k">换仓次数</div><div class="v">'+buys+'</div></div>'
    +'</div>'
    +'<div class="chartbox" style="height:120px;margin-top:10px"><svg viewBox="0 0 1000 120" preserveAspectRatio="none">'
    +'<polyline points="'+sparkPath(r.nav,1000,120)+'" fill="none" stroke="'+(m.total>=0?'#ff4d4f':'#00c853')+'" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div>'
    +'<button class="btn" onclick="saveCustom()">保存到工作台</button>';
  box.scrollIntoView({behavior:'smooth',block:'center'});
}
function saveCustom(){
  if(!LASTBT){ toast('请先回测'); return; }
  var mom={type:NEWP.momType,m1:NEWP.m1,m2:NEWP.m2,m1lo:NEWP.m1lo,m1hi:NEWP.m1hi,m2lo:0,m2hi:10};
