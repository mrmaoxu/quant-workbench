<script>
/* ============ 详情页 ============ */
function navDaily(s,r){
  // 返回 {date:pct, amt}
  var out={}; var nav=r.nav;
  for(var i=1;i<nav.length;i++){
    var prev=nav[i-1][1], cur=nav[i][1];
    out[und(nav[i][0])]={p:(prev?cur/prev-1:0)*100, a:cur-prev};
  }
  if(nav.length) out[und(nav[0][0])]={p:0,a:0};
  return out;
}
var _dailyCache={};
function dailyOf(s,r){ var k=s.id; if(!_dailyCache[k]) _dailyCache[k]=navDaily(s,r); return _dailyCache[k]; }

function rangeNav(s,r){
  var nav=r.nav; if(!nav.length) return [];
  if(VIEW.range==='all') return nav;
  var last=und(nav[nav.length-1][0]);
  var span = VIEW.range==='1m'?22 : VIEW.range==='3m'?66 : VIEW.range==='1y'?250 : nav.length;
  return nav.slice(Math.max(0,nav.length-span));
}

function renderDetail(){
  var s=getStrat(VIEW.sid); if(!s){ go('home'); return; }
  var r=runOf(s);
  var m=s.metrics||r.metrics||{};
  var nav=r.nav||[];
  var last=nav.length?nav[nav.length-1]:[null,0];
  var lastD=last[0]?und(last[0]):AXMASTER[AXMASTER.length-1];
  var tot=(last[1]/ (s.init||1) -1)*100;
    var annLive=(nav.length>1)?(Math.pow(last[1]/(s.init||1),252/nav.length)-1)*100:0;
    if(!s.official && (m.annual===undefined||m.annual===null)) m.annual=annLive;
  var daily=dailyOf(s,r);
  var todayPct=daily[lastD]?daily[lastD].p:0;
  var offHold=(s.holds&&s.holds.length)?s.holds[0]:null;
  var hold=offHold?offHold.code:holdAt(r,lastD);
  var holdDays=offHold&&offHold.date?daysSince2(r,offHold.date,lastD):(hold?daysSince(r,hold,lastD):0);
  var rank=rankAt(s,lastD);
  var target=pickAt(s,lastD);
  var selD=VIEW.selCell||lastD;

  var html='<div class="wrap">';

  /* 头部信息 */
  html+='<div class="card">'
    +'<div class="ttl"><b>'+s.name+'</b><div class="sp"></div>'
    +(s.engine?'<span class="badge cyan">本地复现</span>':(s.official?'<span class="badge gold">官方真值</span>':'<span class="badge blue">本地回测</span>'))+'<span class="badge" style="cursor:pointer" onclick="refreshLive()">刷新</span>'+'</div>'
    +'<div class="mini" style="margin-bottom:12px">'+(s.sub||'')+'</div>'
    +'<div class="grid4">'
    +'<div class="kv"><div class="k">总收益</div><div class="v '+cls(tot)+'">'+pct(tot,1)+'</div></div>'
    +'<div class="kv"><div class="k">年化收益</div><div class="v '+cls(m.annual)+'">'+(m.annual!=null?pct(m.annual,2):'—')+'</div></div>'
    +'<div class="kv"><div class="k">最大回撤</div><div class="v" style="color:#ff8a3d">'+(m.mdd!=null?fmt(m.mdd,2)+'%':'—')+'</div></div>'
    +'<div class="kv"><div class="k">'+(m.sharpe!=undefined?'夏普比率':'波动率')+'</div><div class="v">'+(m.sharpe!=undefined?fmt(m.sharpe,2):(m.vol!=null?fmt(m.vol,1)+'%':'—'))+'</div></div>'
    +'</div>'
    +'<div class="mini" style="margin-top:10px;line-height:1.7">'
    +'净值 <b style="color:#f0b90b">'+fmt(last[1],2)+'</b> · 初始 '+fmt(s.init,0)
    +((m.trades||m.buys)?' · 换仓 '+fmt(m.trades||m.buys,0)+' 次':'')
    +(s.note?'<br><span style="color:#5a6577">'+s.note+'</span>':'')
    +'</div></div>';

  /* 走势图 */
  html+='<div class="card pad0"><div style="padding:14px 14px 6px">'
    +'<div class="ttl"><b>收益走势</b><div class="sp"></div><span class="mini">按住左右滑动查看</span></div>'
    +'<div class="rangetabs">'
    +['1m','3m','1y','all'].map(function(x){return '<div class="rt'+(VIEW.range===x?' on':'')+'" onclick="setRange(\''+x+'\')">'
      +({'1m':'近1月','3m':'近3月','1y':'近1年','all':'全部'})[x]+'</div>';}).join('')
    +'</div></div>'
    +'<div style="padding:0 6px 12px"><div class="chartbox" id="cbox">'
    +'<svg id="csv" viewBox="0 0 1000 196" preserveAspectRatio="none"></svg>'
    +'<div class="xhair" id="xh"></div><div class="xdot" id="xd"></div><div class="xtip" id="xt"></div>'
    +'<div class="ov" id="ov"></div>'
    +'</div></div></div>';

  /* 日历 */
  html+='<div class="card">'
    +'<div class="calhd">'
    +'<div class="nav" onclick="calStep(-1)">‹</div>'
    +'<div class="lab" id="calLab"></div>'
    +'<div class="nav" onclick="calStep(1)">›</div>'
    +'<div class="mode" onclick="toggleCalMode()" id="calModeBtn">日</div>'
    +'</div>'
    +'<div id="calBody"></div>'
    +'<div class="calsum" id="calSum"></div>'
    +'</div>';

  /* 聚焦信息 */
  html+='<div class="card" id="focusCard"></div>';

  /* 调仓指令 */
  html+='<div class="card"><div class="ttl"><b>调仓指令</b><div class="sp"></div><span class="mini">'+dstr(lastD)+'</span></div>'
    +'<div id="cmdBody"></div></div>';

  /* 当前持仓 */
  html+='<div class="card"><div class="ttl"><b>当前持仓</b><div class="sp"></div><span class="mini">按策略自动回填</span></div>'
    +'<div id="posBody"></div></div>';

  /* 排名表 */
  html+='<div class="card pad0"><div style="padding:14px 14px 0"><div class="ttl"><b>标的排名</b>'
    +'<div class="sp"></div><span class="mini">'+dstr(selD)+'</span></div></div>'
    +'<div class="tbwrap" style="padding:0 14px 12px"><table style="min-width:486px">'
    +'<colgroup><col style="width:30px"><col style="width:104px"><col style="width:56px"><col style="width:56px"><col style="width:56px"><col style="width:56px"><col style="width:56px"><col style="width:64px"></colgroup>'
    +'<thead><tr><th>#</th><th class="l">标的</th><th>现价</th><th>涨跌</th><th>M1</th><th>M2</th><th>乖离</th><th>信号</th></tr></thead>'
    +'<tbody id="rankBody"></tbody></table></div>'
    +'<div style="padding:0 14px 10px;font-size:10px;color:#5a6577;text-align:right">表格可左右滑动 · 右侧为 M2 / 乖离 / 信号</div></div>';

  html+='<div class="foot">左滑看日 / 月 / 年收益 · 点格子回显当天</div></div>';
  document.getElementById('app').innerHTML=html;
  document.getElementById('hd').innerHTML='<div class="bk" onclick="go(\'home\')">‹</div><h1>'+s.name+'</h1><div class="sp"></div><span class="badge" id="hdSub">'+s.id+'</span>';
  document.getElementById('hdSub').textContent=s.id;

  drawChart(s,r);
  drawCalendar(s,r);
  drawFocus(s,r,selD);
  drawCmd(s,r,lastD,hold,holdDays,target);
  drawPos(s,r,lastD,hold,todayPct);
  drawRank(s,r,selD,hold);
  bind();
}

function amtFmt(v){
  if(v===null||v===undefined||isNaN(v)) return '—';
  if(v>=10000) return (v/10000).toFixed(1)+'万';
  if(v>=1000) return (v/1000).toFixed(1)+'k';
  return Math.round(v)+'';
}
function daysSince2(r,d1,d2){ return daysBetween(r,d1,d2); }
function daysSince(r,code,d){
  var nav=r.nav;
  for(var i=nav.length-1;i>=0;i--){
    if(r.holdMap[und(nav[i][0])]===code){ if(i>0&&r.holdMap[und(nav[i-1][0])]!==code) return nav.length-1-i+1; }
    else break;
  }
  return 1;
}
function holdAt(r,d){
  if(!r.holdMap) return null;
  return r.holdMap[und(d)]||null;
}

/* ---- 走势图 ---- */
var CHART={pts:[],xs:[],nav:[]};
function drawChart(s,r){
  var navs=rangeNav(s,r);
  var svg=document.getElementById('csv');
  if(!navs.length||!svg) return;
  var vs=navs.map(function(x){return x[1];});
  var mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs), rg=(mx-mn)||1;
  var W=1000,H=196,padT=14,padB=16;
  var pts=navs.map(function(x,i){ return [ i/(navs.length-1)*W, padT+(1-(x[1]-mn)/rg)*(H-padT-padB) ]; });
  CHART.pts=pts; CHART.nav=navs;
  var y0=padT+(1-(navs[0][1]-mn)/rg)*(H-padT-padB);
  var y1=pts[pts.length-1][1];
  var col=navs[navs.length-1][1]>=navs[0][1]?'#ff4d4f':'#00c853';
  // 网格
  var g='';
  for(var k=0;k<=3;k++){
    var gy=padT+k*(H-padT-padB)/3;
    g+='<line x1="0" y1="'+gy+'" x2="'+W+'" y2="'+gy+'" stroke="#232b3a" stroke-width="1" vector-effect="non-scaling-stroke"/>';
  }
  var dpath=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
  var area='M'+pts[0][0].toFixed(1)+' '+(H-padB)+' L'+pts.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' L')+' L'+pts[pts.length-1][0].toFixed(1)+' '+(H-padB)+' Z';
  var gd=col==='#ff4d4f'?'rgba(255,77,79,.13)':'rgba(0,200,83,.13)';
  svg.innerHTML=g
    +'<path d="'+area+'" fill="'+gd+'"/>'
    +'<path d="'+dpath+'" fill="none" stroke="'+col+'" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>'
    +'<line x1="0" y1="'+y0.toFixed(1)+'" x2="'+W+'" y2="'+y0.toFixed(1)+'" stroke="#2c3648" stroke-width="1" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>';
  // 尾点
  svg.innerHTML+='<circle cx="'+pts[pts.length-1][0].toFixed(1)+'" cy="'+pts[pts.length-1][1].toFixed(1)+'" r="3" fill="'+col+'" vector-effect="non-scaling-stroke"/>';
  // 首末日期
  svg.innerHTML+='<text x="2" y="192" fill="#5a6577" font-size="10">'+navs[0][0].slice(2)+'</text>'
    +'<text x="986" y="192" fill="#5a6577" font-size="10" text-anchor="end">'+navs[navs.length-1][0].slice(2)+'</text>';
}
function showXAt(clientX){
  var box=document.getElementById('cbox'); if(!box||!CHART.pts.length) return;
  var rc=box.getBoundingClientRect();
  var rx=Math.max(0,Math.min(1,(clientX-rc.left)/rc.width));
  var W=1000; var want=rx*W;
  // 二分找最近点
  var lo=0,hi=CHART.pts.length-1;
  while(lo<hi){ var mid=(lo+hi)>>1; if(CHART.pts[mid][0]<want) lo=mid+1; else hi=mid; }
  if(lo>0 && Math.abs(CHART.pts[lo][0]-want)>Math.abs(CHART.pts[lo-1][0]-want)) lo--;
  var p=CHART.pts[lo], nv=CHART.nav[lo];
  var xp=(p[0]/W)*100;
  var xh=document.getElementById('xh'), xd=document.getElementById('xd'), xt=document.getElementById('xt');
  xh.style.display='block'; xh.style.left=xp+'%';
  xd.style.display='block'; xd.style.left=xp+'%'; xd.style.top=(p[1]/196*100)+'%';
  var prev=lo>0?CHART.nav[lo-1][1]:nv[1];
  var dp=prev?((nv[1]/prev-1)*100):0;
  var txt='<b>'+nv[0]+'</b><br>净值 '+fmt(nv[1],2)+'<br>当日 <span style="color:'+(dp>=0?'#ff4d4f':'#00c853')+'">'+pct(dp,2)+'</span>';
  xt.innerHTML=txt; xt.style.display='block';
  xt.style.left=Math.max(30,Math.min(70,xp))+'%';
  xt.style.transform='translateX('+(xp<30?'-20%':xp>70?'-80%':'-50%')+')';
  VIEW.focus=und(nv[0]);
}
function hideX(){
  ['xh','xd','xt'].forEach(function(i){var e=document.getElementById(i); if(e) e.style.display='none';});
}
function bind(){
  var ov=document.getElementById('ov');
  if(ov && !ov._b){
    ov._b=true;
    var down=false;
    ov.addEventListener('pointerdown',function(e){down=true; ov.setPointerCapture&&ov.setPointerCapture(e.pointerId); showXAt(e.clientX); e.preventDefault();});
    ov.addEventListener('pointermove',function(e){ if(down){ showXAt(e.clientX); e.preventDefault(); } });
    ov.addEventListener('pointerup',function(e){ if(down&&VIEW.focus){ VIEW.selCell=VIEW.focus; var s=getStrat(VIEW.sid); var r=runOf(s); var selD=VIEW.focus; drawFocus(s,r,selD); drawRank(s,r,selD,holdAt(r,selD)); } down=false; });
    ov.addEventListener('pointercancel',function(){down=false;});
    ov.addEventListener('pointerleave',function(e){ if(!down) hideX(); });
  }
}
function setRange(x){ VIEW.range=x; VIEW.selCell=null; var s=getStrat(VIEW.sid); var r=runOf(s); renderDetail(); }

/* ---- 日历 ---- */
function toggleCalMode(){
  VIEW.calMode = VIEW.calMode==='d'?'m':VIEW.calMode==='m'?'y':'d';
  var s=getStrat(VIEW.sid); var r=runOf(s); drawCalendar(s,r);
}
function calStep(dir){
  if(VIEW.calMode==='d'){
    VIEW.calM+=dir;
    if(VIEW.calM<1){VIEW.calM=12;VIEW.calY--;} if(VIEW.calM>12){VIEW.calM=1;VIEW.calY++;}
  }else if(VIEW.calMode==='m'){ VIEW.calY+=dir; }
  else { VIEW.calY+=dir*1; }
  var s=getStrat(VIEW.sid); var r=runOf(s); drawCalendar(s,r);
}
function navEq(r,d){
  var v=null;
  for(var i=0;i<r.nav.length;i++){ if(und(r.nav[i][0])<=d) v=r.nav[i][1]; }
  return v;
}
function heat(p){
  if(p===null||p===undefined||isNaN(p)) return '';
  var a=Math.min(Math.abs(p)/5,1);
  if(p>0) return ' style="background:linear-gradient(160deg,rgba(255,77,106,'+(0.05+a*0.3).toFixed(3)+'),rgba(255,77,106,.02))"';
  if(p<0) return ' style="background:linear-gradient(160deg,rgba(0,224,138,'+(0.05+a*0.28).toFixed(3)+'),rgba(0,224,138,.02))"';
  return '';
}
function drawCalendar(s,r){
  var daily=dailyOf(s,r);
  var body=document.getElementById('calBody'), lab=document.getElementById('calLab'), sum=document.getElementById('calSum');
  var modeBtn=document.getElementById('calModeBtn');
  if(!body) return;
  modeBtn.textContent = VIEW.calMode==='d'?'日':VIEW.calMode==='m'?'月':'年';
  var thisY=VIEW.calY;
  if(VIEW.calMode==='d'){
    lab.textContent=thisY+'年'+VIEW.calM+'月';
    var first=new Date(thisY,VIEW.calM-1,1), wd=first.getDay(), days=new Date(thisY,VIEW.calM,0).getDate();
    var grid='';
    ['日','一','二','三','四','五','六'].forEach(function(w){grid+='<div class="cwd">'+w+'</div>';});
    for(var i=0;i<wd;i++) grid+='<div class="cell empty"></div>';
    var mf=1, cnt=0;
    for(var dd=1;dd<=days;dd++){
      var ds=thisY+pad(VIEW.calM)+pad(dd);
      var it=daily[ds];
      var isToday = ds===und(r.nav[r.nav.length-1][0]);
      var sel = ds===VIEW.selCell;
      if(it){ mf*=(1+it.p/100); cnt++; }
      grid+='<div class="cell'+(isToday?' today':'')+(sel?' sel':'')+'"'+(it?heat(it.p):'')+(it?' onclick="pickCell(\''+ds+'\')"':'')
        +'><div class="dd">'+dd+'</div>'
        +(it?'<div class="rr '+cls(it.p)+'">'+pct(it.p,2)+'</div><div class="am '+(it.a>=0?'up':'dn')+'">'+(it.a>=0?'+':'-')+amtFmt(Math.abs(it.a))+'</div>':'')
        +'</div>';
    }
    body.className='calgrid d'; body.innerHTML=grid;
    var msum=(mf-1)*100;
    if(sum) sum.innerHTML='<span>本月累计 · '+cnt+'个交易日</span><b class="'+cls(msum)+'">'+pct(msum,2)+'</b>';
  }else if(VIEW.calMode==='m'){
    lab.textContent=thisY+'年';
    var grid2='', ysum=0, ycnt=0;
    for(var mm=1;mm<=12;mm++){
      var ds2=thisY+pad(mm);
      var mfac=1, has=false;
      for(var k in daily){ if(k.slice(0,6)===ds2){ mfac*=(1+daily[k].p/100); has=true; } }
      var acc=(mfac-1)*100;
      if(has){ycnt++;}
      grid2+='<div class="cell'+(has?'':' empty')+'"'+(has?heat(acc):'')+(has?' onclick="jumpMonth('+thisY+','+mm+')"':'')
        +'><div class="dd">'+mm+'月</div>'
        +(has?'<div class="rr '+cls(acc)+'">'+pct(acc,2)+'</div>':'<div class="rr gray">—</div>')
        +'</div>';
    }
    body.className='calgrid m'; body.innerHTML=grid2;
    var vEnd=navEq(r, String(thisY)+'1231'), vPre=navEq(r, String(thisY-1)+'1231');
    var ysum;
    if(vEnd&&vPre&&vPre>0) ysum=(vEnd/vPre-1)*100;
    else { var yfac=1; for(var kk in daily){ if(kk.slice(0,4)===String(thisY)) yfac*=(1+daily[kk].p/100); } ysum=(yfac-1)*100; }
    if(sum) sum.innerHTML='<span>本年累计 · '+ycnt+'个月</span><b class="'+cls(ysum)+'">'+pct(ysum,2)+'</b>';
  }else{
    lab.textContent='年度收益';
    var ys={};
    var ye={};
    for(var ni=0;ni<r.nav.length;ni++){ ye[und(r.nav[ni][0]).slice(0,4)]=r.nav[ni][1]; }
    var prevY=s.init||1;
    Object.keys(ye).sort().forEach(function(y){ ys[y]=(ye[y]/prevY-1)*100; prevY=ye[y]; });
    var grid3='', tot=0;
    var keys=Object.keys(ys).sort();
    // 保持 3 列布局，从 calY 起往前显示 9 年
    var endY=VIEW.calY, startY=endY-8;
    for(var yy=startY;yy<=endY;yy++){
      var has2=ys[yy]!==undefined;
      if(has2) tot+=ys[yy];
      grid3+='<div class="cell'+(has2?'':' empty')+'"'+(has2?heat(ys[yy]):'')+(has2?' onclick="jumpYear('+yy+')"':'')
        +'><div class="dd">'+yy+'</div>'
        +(has2?'<div class="rr '+cls(ys[yy])+'">'+pct(ys[yy],1)+'</div>':'<div class="rr gray">—</div>')
        +'</div>';
    }
    var totf=null;
    var vE=navEq(r, String(endY)+'1231'), vS=navEq(r, String(startY-1)+'1231');
    if(vE&&vS&&vS>0) totf=vE/vS;
    body.className='calgrid y'; body.innerHTML=grid3;
    var tot;
    if(totf!==null) tot=(totf-1)*100;
    else { var tf=1; for(var yy3=startY;yy3<=endY;yy3++){ if(ys[yy3]!==undefined) tf*=(1+ys[yy3]/100); } tot=(tf-1)*100; }
    if(sum) sum.innerHTML='<span>区间累计 · '+startY+'~'+endY+'（净值口径）</span><b class="'+cls(tot)+'">'+pct(tot,1)+'</b>';
  }
}
function jumpMonth(y,m){ VIEW.calMode='d'; VIEW.calY=y; VIEW.calM=m; var s=getStrat(VIEW.sid); var r=runOf(s); drawCalendar(s,r); }
function jumpYear(y){ VIEW.calMode='m'; VIEW.calY=y; var s=getStrat(VIEW.sid); var r=runOf(s); drawCalendar(s,r); }
function pickCell(ds){
  VIEW.selCell=ds;
  if(VIEW.calMode==='d'){ VIEW.calY=+ds.slice(0,4); VIEW.calM=+ds.slice(4,6); }
  var s=getStrat(VIEW.sid); var r=runOf(s);
  drawCalendar(s,r);
  drawFocus(s,r,ds);
  drawRank(s,r,ds,holdAt(r,ds));
}

/* ---- 聚焦信息 ---- */
function drawFocus(s,r,ds){
  var el=document.getElementById('focusCard'); if(!el) return;
  var daily=dailyOf(s,r);
  var it=daily[ds];
  var h=holdAt(r,ds);
  var nm=(h&&s.names&&s.names[h])||h||'空仓';
  var lastD=und(r.nav[r.nav.length-1][0]);
  var cum=1;
  for(var k in daily){ if(k<=ds) cum*=(1+daily[k].p/100); }
  cum=(cum-1)*100;
  var navV=null;
  for(var q=0;q<r.nav.length;q++){ if(und(r.nav[q][0])<=ds) navV=r.nav[q][1]; }
  if(navV&&s.init) cum=(navV/s.init-1)*100;
  if(!it){ el.innerHTML='<div class="ttl"><b>聚焦</b></div><div class="mini">'+dstr(ds)+' 非交易日（或暂无数据）</div>'; return; }
  el.innerHTML='<div class="ttl"><b>聚焦 · '+dstr(ds)+'</b><div class="sp"></div>'
    +(ds===lastD?'<span class="badge gold">最新</span>':'<span class="badge">历史</span>')+'</div>'
    +'<div class="grid4">'
    +'<div class="kv"><div class="k">当日收益</div><div class="v '+cls(it.p)+'">'+pct(it.p,2)+'</div></div>'
    +'<div class="kv"><div class="k">当日盈亏</div><div class="v '+(it.a>=0?'up':'dn')+'">'+(it.a>=0?'+':'')+fmt(it.a,0)+'</div></div>'
    +'<div class="kv"><div class="k">累计收益</div><div class="v '+cls(cum)+'">'+pct(cum,1)+'</div></div>'
    +'<div class="kv"><div class="k">当日持仓</div><div class="v" style="font-size:14px;color:#f0b90b">'+nm+'</div></div>'
    +'</div>';
}

/* ---- 调仓指令 ---- */
function drawCmd(s,r,lastD,hold,holdDays,target){
  var el=document.getElementById('cmdBody'); if(!el) return;
  var CMD_EXTRA='';
  var todayPct=0;
  var daily=dailyOf(s,r); if(daily[lastD]) todayPct=daily[lastD].p;
  var navV=r.nav[r.nav.length-1][1];
  var budget=navV*(1-(s.reserve===undefined?0.02:s.reserve));
  var tgt=target?target.code:null;
  var tgtNm=target?(target.name||tgt):'—';
  var action='', color='gray', big='';
  if(!hold && !tgt){
    action='空仓等待'; big='无合格标的';
  }else if(!hold && tgt){
    action='买入'; color='up';
    var pxB0=pxAt(tgt,lastD);
    var sh0=pxB0?Math.floor(budget/pxB0/(s.lot||100))*(s.lot||100):0;
    big='买入 '+tgtNm;
    CMD_EXTRA='约 '+sh0+' 份 @ '+fmt(pxB0,3)+' · 动用 '+fmt(budget,0)+' 元';
  }else if(hold && tgt===hold){
    action='继续持有'; color='hold-t'; big='持有 '+((s.names&&s.names[hold])||hold);
  }else if(hold && !tgt){
    action='卖出'; color='dn'; big='清仓 '+((s.names&&s.names[hold])||hold);
  }else{
    action='换仓'; color='up'; big=((s.names&&s.names[hold])||hold)+' → '+tgtNm;
  }
  var note='';
  if(hold && tgt && tgt!==hold){
    var pxB=pxAt(tgt,lastD);
    var sh2=pxB?Math.floor(budget/pxB/(s.lot||100))*(s.lot||100):0;
    note='卖出 '+((s.names&&s.names[hold])||hold)+' 全部 · 买入 '+tgtNm+' 约 '+sh2+' 份 @ '+fmt(pxB,3)+' · 动用 '+fmt(budget,0)+' 元';
  }else if(hold && tgt===hold){
    note='已持有 '+holdDays+' 个交易日'+(s.minHold?'（最短 '+s.minHold+' 日'+(holdDays>=s.minHold?'，已解锁':'，锁定期内')+'）':'')
      +(hold&&s.mom?' · 当前动量 '+(function(){var rr=rankAt(s,lastD);for(var i=0;i<rr.length;i++)if(rr[i].code===hold)return fmt(rr[i].m1,3);return '—';})():'');
  }else if(!hold&&tgt){
    note='首次建仓 · 建议 '+ (s.exec||'收盘前') +' 执行';
  }else if(hold&&!tgt){
    note='标的跌破动量阈值（'+(s.mom.m1lo*100).toFixed(1)+'%~'+(s.mom.m1hi*100).toFixed(0)+'%），全部转现金';
  }else{
    note='无合格标的，保持现金';
  }
  el.innerHTML='<div class="cmd">'
    +'<div class="h"><span class="tag '+(color==='gray'?'no':color)+'">'+action+'</span>'
    +'<span class="mini">当日 <span class="'+cls(todayPct)+'">'+pct(todayPct,2)+'</span></span></div>'
    +'<div class="big '+(color==='up'?'up':color==='dn'?'dn':'gold')+'">'+big+'</div>'
    +'<div class="l">'+note+'</div>'
    +(CMD_EXTRA?'<div class="l" style="color:#e6eaf2;margin-top:3px">'+CMD_EXTRA+'</div>':'')
    +'</div>';
}

/* ---- 持仓 ---- */
function drawPos(s,r,lastD,hold,todayPct){
  var el=document.getElementById('posBody'); if(!el) return;
  var off=(s.holds&&s.holds.length)?s.holds[0]:null;
  if(!hold&&!off){ el.innerHTML='<div class="mini" style="padding:8px 0">当前空仓（现金等待信号）</div>'; return; }
  var code=off?off.code:hold;
  var px=pxAt(code,lastD);
  var navV=(r.nav&&r.nav.length)?r.nav[r.nav.length-1][1]:0;
  var sh=off?off.qty:(px?Math.floor((navV*(1-(s.reserve===undefined?0.02:s.reserve)))/px/(s.lot||100))*(s.lot||100):0);
  var mv=sh*(px||0);
  var pnl=mv*((todayPct||0)/100);
  var bp=off&&off.px?fmt(off.px,3):(px?fmt(px,3):'—');
  var hd=off&&off.date?daysBetween(r,off.date,lastD):daysSince(r,hold,lastD);
  el.innerHTML='<div class="pos">'
    +'<div class="ic">'+(code||'').slice(2,4)+'</div>'
    +'<div class="mn"><b>'+((s.names&&s.names[code])||code)+'</b><span>'+code+' · 买入 '+bp+' · 持有 '+hd+' 日</span></div>'
    +'<div class="rt"><b class="'+cls(todayPct)+'">'+pct(todayPct,2)+'</b><span>'+fmt(sh,0)+' 份</span></div>'
    +'</div>'
    +'<div class="pos" style="border-bottom:0"><div class="mn"><b style="color:#7d93ad;font-weight:400;font-size:12px">持仓市值 / 今日盈亏</b></div>'
    +'<div class="rt"><b>'+fmt(mv,0)+'</b><span class="'+(pnl>=0?'up':'dn')+'">'+(pnl>=0?'+':'')+fmt(pnl,0)+' 元</span></div></div>';
}
function daysBetween(r,d1,d2){
  d1=und(String(d1)); d2=und(String(d2));
  var i1=-1,i2=-1;
  for(var i=0;i<r.nav.length;i++){ var d=und(r.nav[i][0]); if(d===d1&&i1<0)i1=i; if(d===d2)i2=i; }
  if(i1<0||i2<0) return 0;
  return Math.max(i2-i1,0);
}

/* ---- 排名表 ---- */
function biasOf(code,d,n){
  var cl=clUpTo(code,d); if(!cl||cl.length<n) return null;
  var s=0; for(var i=cl.length-n;i<cl.length;i++) s+=cl[i];
  var ma=s/n; if(!(ma>0)) return null;
  return cl[cl.length-1]/ma-1;
}
function drawRank(s,r,ds,holdCode){
  var tb=document.getElementById('rankBody'); if(!tb) return;
  var rk=rankAt(s,ds);
  var target=pickAt(s,ds);
  var rows='';
  rk.forEach(function(x,i){
    var isHold=x.code===holdCode;
    var isTgt=target&&x.code===target.code;
    var sig = isHold?'<span class="tag hold-t">持有</span>'
      : isTgt&&!isHold?'<span class="tag buy">买入</span>'
      : x.ok?'<span class="tag no">候选</span>':'<span class="tag no">不合格</span>';
    var bz=biasOf(x.code,ds,20);
    rows+='<tr class="'+(isHold?'hold':'')+'">'
      +'<td>'+(i+1)+'</td>'
      +'<td class="l"><span class="cd">'+x.code+'</span><span class="cn">'+x.name+'</span></td>'
      +'<td>'+fmt(x.px,3)+'</td>'
      +'<td class="'+cls(x.chg)+'">'+pct(x.chg,2)+'</td>'
      +'<td class="'+(x.ok?'':'gray')+'">'+(s.mom.type==='pct'?pct(x.m1*100,2):fmt(x.m1,3))+'</td>'
      +'<td class="gray">'+(x.m2!==null&&x.m2!==undefined?(s.mom.type==='pct'?pct(x.m2*100,2):fmt(x.m2,3)):'—')+'</td>'
      +'<td class="'+cls(bz)+'">'+(bz!==null?pct(bz*100,2):'—')+'</td>'
      +'<td>'+sig+'</td>'
      +'</tr>';
  });
  tb.innerHTML=rows||'<tr><td colspan="8" class="gray" style="text-align:center;padding:14px">暂无数据</td></tr>';
}
</script>

<script>
var LIVE={};
function secOf(c){ return (c[0]==='5'||c[0]==='6'?'sh':'sz')+c; }
function refreshLive(){
  var s=getStrat(VIEW.sid); if(!s) return;
  var secs=s.pool.map(secOf);
  toast('拉取最新价…');
  var sc=document.createElement('script');
  sc.src='https://qt.gtimg.cn/q='+secs.join(',')+'&r='+Math.random();
  sc.onload=sc.onerror=function(){
    var live={}, n=0;
    for(var i=0;i<s.pool.length;i++){
      var sec=secs[i], raw=window['v_'+sec];
      if(!raw) continue;
      var f=String(raw).split('~');
      if(f.length<5) continue;
      var px=parseFloat(f[3]), prev=parseFloat(f[4]);
      if(!(px>0)||!(prev>0)) continue;
      live[s.pool[i]]={px:px,prev:prev,chg:(px/prev-1)*100};
      n++;
    }
    try{ sc.remove(); }catch(e){}
    if(!n){ toast('联网失败，仍用内置数据'); return; }
    LIVE=live;
    var r=runOf(s);
    var lastD=und(r.nav[r.nav.length-1][0]);
    var hold=holdAt(r,lastD);
    var tp=(hold&&LIVE[hold])?LIVE[hold].chg:0;
    try{ drawPos(s,r,lastD,hold,tp); }catch(e){}
    var rk=rankAt(s,lastD).slice(), target=pickAt(s,lastD), rows='';
    rk.forEach(function(x,i){
      var L=LIVE[x.code];
      var px=L?L.px:x.px, chg=L?L.chg:x.chg;
      var isHold=x.code===hold, isTgt=target&&x.code===target.code;
      var sig=isHold?'<span class="tag hold-t">持有</span>':(isTgt?'<span class="tag buy">买入</span>':(x.ok?'<span class="tag no">候选</span>':'<span class="tag no">不合格</span>'));
      var bz=biasOf(x.code,lastD,20);
      rows+='<tr class="'+(isHold?'hold':'')+'"><td>'+(i+1)+'</td>'
        +'<td class="l"><span class="cd">'+x.code+'</span><span class="cn">'+x.name+'</span></td>'
        +'<td>'+fmt(px,3)+'</td><td class="'+cls(chg)+'">'+pct(chg,2)+'</td>'
        +'<td class="'+(x.ok?'':'gray')+'">'+(s.mom.type==='pct'?pct(x.m1*100,2):fmt(x.m1,3))+'</td>'
        +'<td class="gray">'+(x.m2!=null?(s.mom.type==='pct'?pct(x.m2*100,2):fmt(x.m2,3)):'—')+'</td>'
        +'<td class="'+cls(bz)+'">'+(bz!==null?pct(bz*100,2):'—')+'</td><td>'+sig+'</td></tr>';
    });
    var tb=document.getElementById('rankBody'); if(tb) tb.innerHTML=rows;
    toast('已更新 '+n+' 只 · '+new Date().toTimeString().slice(0,5));
  };
  document.head.appendChild(sc);
}
</script>
